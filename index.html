<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧座位表生成器</title>
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 設定字體和 Tailwind 配置 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease;
        }
        .glass-card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        /* 拖拽效果 */
        .drag-over {
            border: 3px dashed #10B981 !important; /* 綠色邊框 */
            background-color: rgba(16, 185, 129, 0.2) !important;
        }

        .student-tag:hover {
            cursor: move;
            transform: scale(1.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 列印優化 */
        @media print {
            body {
                background: none !important;
            }
            #control-panel, #print-button, #class-name-input {
                display: none !important;
            }
            #seating-chart-container {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: none !important;
                box-shadow: none !important;
                backdrop-filter: none !important;
            }
            .glass-card, .seat-desk {
                background-color: white !important;
                border: 1px solid #333 !important;
                box-shadow: none !important;
                color: black !important;
            }
            .seat-desk {
                border-radius: 4px !important;
                padding: 0.5rem !important;
                height: auto !important;
            }
            .bulletin-board {
                border-bottom: 2px solid #333 !important;
                color: black !important;
            }
            /* 讓學生標籤在列印時更清晰 */
            .student-tag {
                background-color: #eee !important;
                color: black !important;
                border: 1px dashed #555 !important;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 min-h-screen p-4 md:p-8 text-white">

    <div id="app" class="flex flex-col md:flex-row gap-8 max-w-7xl mx-auto">
        
        <!-- 左側控制面板 -->
        <div id="control-panel" class="md:w-1/3 w-full p-6 rounded-2xl glass-card transition-all duration-300">
            <h1 class="text-3xl font-bold mb-6 text-indigo-200">智慧座位表控制台</h1>

            <!-- 班級名稱 -->
            <div class="mb-6">
                <label for="class-name-input" class="block mb-2 text-sm font-medium text-white/80">班級名稱</label>
                <input type="text" id="class-name-input" value="三年一班" oninput="updateClassName(this.value)"
                       class="w-full p-3 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition placeholder-white/50"
                       placeholder="輸入班級名稱">
            </div>

            <!-- 1. 學生名單管理 -->
            <div class="mb-6">
                <h2 class="text-xl font-semibold mb-3 text-purple-200">學生名單 (每行一個姓名)</h2>
                <textarea id="student-list-input" rows="8" 
                          class="w-full p-3 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-purple-300 transition text-sm resize-none"
                          placeholder="請在這裡輸入學生姓名，每行一個。範例：&#10;張三&#10;李四&#10;王五">
張三
李四
王五
趙六
陳七
林八
黃九
吳十
徐小明
許小華
鄭大偉
朱小莉
郭文傑
高美玲
曾志明
游心怡
彭于晏</textarea>
                <button onclick="loadStudents()" class="w-full mt-3 p-3 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-xl transition duration-200 shadow-md shadow-indigo-500/50">
                    載入學生名單
                </button>
            </div>

            <!-- 2. 座位配置 -->
            <div class="mb-6">
                <h2 class="text-xl font-semibold mb-3 text-purple-200">座位配置</h2>
                
                <div class="flex flex-col space-y-3">
                    <!-- 列數 (Cols) -->
                    <div>
                        <label for="cols-slider" class="block mb-1 text-sm font-medium text-white/80">
                            列數 (3-7): <span id="cols-value" class="font-bold text-indigo-300">5</span>
                        </label>
                        <input type="range" id="cols-slider" min="3" max="7" value="5" oninput="updateConfig()"
                               class="w-full h-2 bg-white/20 rounded-lg appearance-none cursor-pointer range-lg">
                    </div>

                    <!-- 行數 (Rows) -->
                    <div>
                        <label for="rows-slider" class="block mb-1 text-sm font-medium text-white/80">
                            行數 (4-8): <span id="rows-value" class="font-bold text-indigo-300">5</span>
                        </label>
                        <input type="range" id="rows-slider" min="4" max="8" value="5" oninput="updateConfig()"
                               class="w-full h-2 bg-white/20 rounded-lg appearance-none cursor-pointer range-lg">
                    </div>

                    <!-- 3. 座位模式 (單人/雙人) -->
                    <div class="flex items-center justify-between pt-2">
                        <span class="text-sm font-medium text-white/80">座位模式:</span>
                        <button id="desk-mode-toggle" onclick="toggleDeskMode()"
                                class="p-2 px-4 rounded-full font-bold text-sm transition duration-200">
                            雙人座
                        </button>
                    </div>
                </div>
            </div>

            <!-- 4. 智慧分配 & 重置 -->
            <div class="space-y-3 mb-6">
                <button onclick="randomAssignStudents()" class="w-full p-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl transition duration-200 shadow-md shadow-green-500/50">
                    一鍵智慧隨機分配
                </button>
                <button onclick="resetApp()" class="w-full p-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition duration-200 shadow-md shadow-red-500/50">
                    清空座位與重置
                </button>
            </div>

            <!-- 統計資訊 -->
            <div class="p-4 rounded-xl bg-white/10 border border-white/20">
                <h3 class="text-lg font-semibold mb-2 text-yellow-200">統計資訊</h3>
                <p class="text-sm">總學生數: <span id="stat-total" class="font-bold">0</span></p>
                <p class="text-sm">已安排座位: <span id="stat-assigned" class="font-bold text-green-300">0</span></p>
                <p class="text-sm">待安排學生: <span id="stat-unassigned" class="font-bold text-red-300">0</span></p>
            </div>
        </div>

        <!-- 右側座位表預覽 -->
        <div id="seating-chart-container" class="md:w-2/3 w-full p-6 rounded-2xl glass-card flex flex-col transition-all duration-300">
            
            <header class="mb-4">
                <h1 id="chart-title" class="text-3xl font-extrabold text-center mb-2 text-white shadow-sm">三年一班座位表</h1>
                <button id="print-button" onclick="window.print()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow-lg block mx-auto print:hidden">
                    列印座位表
                </button>
            </header>

            <!-- 教室佈局：佈告欄 -->
            <div class="bulletin-board w-full h-12 bg-indigo-700/80 rounded-t-lg mb-4 flex items-center justify-center text-xl font-bold border-b-4 border-yellow-400">
                前排黑板/佈告欄
            </div>
            
            <!-- 座位表核心區域 -->
            <div id="seating-chart" class="flex-grow grid gap-3 p-2 bg-black/10 rounded-xl overflow-auto transition-all duration-300">
                <!-- 座位將由 JavaScript 動態生成 -->
            </div>

            <!-- 教室佈局：老師座位 -->
            <div class="w-full flex justify-end mt-4">
                <div class="p-3 bg-red-600/80 rounded-lg text-sm font-bold text-white shadow-xl transform rotate-3">
                    老師座位
                </div>
            </div>

            <!-- 提示訊息區 -->
            <div id="message-box" class="mt-4 p-3 bg-white/10 rounded-xl text-center text-sm font-medium hidden">
                點擊一位待安排學生，再點擊一個空座位進行手動安排。
            </div>

            <!-- 待安排學生名單 -->
            <div id="unassigned-students-area" class="mt-4 p-3 rounded-xl glass-card">
                <h3 class="text-lg font-semibold mb-2 text-indigo-200">待安排學生 (可拖入座位)</h3>
                <div id="unassigned-students-list" class="flex flex-wrap gap-2 text-sm min-h-[40px]">
                    <!-- 待安排學生標籤將由 JavaScript 動態生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 應用程式狀態 ---
        let students = []; // 學生列表: [{ id: 1, name: '張三' }]
        let seatingMatrix = []; // 座位矩陣: [{ id: 'R1C1', student: { id: 1, name: '張三' } | null }]
        let config = {
            rows: 5,
            cols: 5,
            isDoubleDesk: true, // true: 雙人座, false: 單人座
            className: '三年一班'
        };
        let selectedStudent = null; // 用於點擊手動分配功能
        let dragSourceDeskId = null; // 用於拖拽交換的來源座位 ID
        let nextStudentId = 1;

        // --- DOM 元素引用 ---
        const $colsSlider = document.getElementById('cols-slider');
        const $rowsSlider = document.getElementById('rows-slider');
        const $colsValue = document.getElementById('cols-value');
        const $rowsValue = document.getElementById('rows-value');
        const $deskModeToggle = document.getElementById('desk-mode-toggle');
        const $seatingChart = document.getElementById('seating-chart');
        const $unassignedList = document.getElementById('unassigned-students-list');
        const $chartTitle = document.getElementById('chart-title');
        const $messageBox = document.getElementById('message-box');

        // --- 核心函數：初始化與配置更新 ---

        /** 初始化應用程式狀態 */
        function initializeApp() {
            // 載入預設學生名單
            loadStudents();
            updateConfig();
        }

        /** 更新座位表配置 (行數/列數/模式) */
        function updateConfig() {
            config.rows = parseInt($rowsSlider.value);
            config.cols = parseInt($colsSlider.value);
            $rowsValue.textContent = config.rows;
            $colsValue.textContent = config.cols;

            // 調整 seatingMatrix 大小
            resizeSeatingMatrix();
            renderApp();
        }

        /** 調整 seatingMatrix 的大小和初始化內容 */
        function resizeSeatingMatrix() {
            const newMatrix = [];
            for (let r = 1; r <= config.rows; r++) {
                for (let c = 1; c <= config.cols; c++) {
                    const id = `R${r}C${c}`;
                    const existingSeat = seatingMatrix.find(s => s.id === id);

                    if (existingSeat) {
                        newMatrix.push(existingSeat);
                    } else {
                        // 初始化新的座位為空
                        newMatrix.push({ id: id, student: null });
                    }
                }
            }
            seatingMatrix = newMatrix;
        }

        /** 切換單人/雙人座位模式 */
        function toggleDeskMode() {
            config.isDoubleDesk = !config.isDoubleDesk;
            $deskModeToggle.textContent = config.isDoubleDesk ? '雙人座' : '單人座';
            $deskModeToggle.className = config.isDoubleDesk
                ? 'p-2 px-4 rounded-full font-bold text-sm transition duration-200 bg-red-400 hover:bg-red-500'
                : 'p-2 px-4 rounded-full font-bold text-sm transition duration-200 bg-blue-400 hover:bg-blue-500';
            renderApp();
        }
        
        /** 更新班級名稱 */
        function updateClassName(name) {
            config.className = name || '智慧座位表';
            $chartTitle.textContent = config.className + '座位表';
        }

        /** 重置所有狀態 */
        function resetApp() {
            students = [];
            seatingMatrix = [];
            selectedStudent = null;
            nextStudentId = 1;
            document.getElementById('student-list-input').value = '';
            $messageBox.classList.add('hidden');
            updateConfig(); // 重新初始化座位矩陣
            renderApp();
        }

        // --- 學生管理函數 ---

        /** 載入並處理學生名單 */
        function loadStudents() {
            const input = document.getElementById('student-list-input').value;
            const names = input.split('\n')
                               .map(name => name.trim())
                               .filter(name => name.length > 0);
            
            students = [];
            nextStudentId = 1;

            names.forEach(name => {
                students.push({ id: nextStudentId++, name: name });
            });

            // 清空所有已安排的座位
            seatingMatrix.forEach(seat => {
                seat.student = null;
            });
            
            // 調整座位大小以防配置改變
            resizeSeatingMatrix(); 
            renderApp();
        }

        /** 5. 拖拽交換座位：處理拖拽結束 */
        function handleDrop(e) {
            e.preventDefault();
            const targetDesk = e.currentTarget;
            targetDesk.classList.remove('drag-over');

            const sourceId = dragSourceDeskId;
            const targetId = targetDesk.dataset.deskId;

            // 1. 如果是從座位拖拽到座位 (交換)
            if (sourceId && sourceId.startsWith('R') && targetId.startsWith('R')) {
                const sourceSeat = seatingMatrix.find(s => s.id === sourceId);
                const targetSeat = seatingMatrix.find(s => s.id === targetId);

                if (sourceSeat) {
                    // 交換學生 (即使目標座位為空也可)
                    const tempStudent = targetSeat.student;
                    targetSeat.student = sourceSeat.student;
                    sourceSeat.student = tempStudent;

                    // 重置拖拽狀態
                    dragSourceDeskId = null; 
                    renderApp();
                }
            } 
            // 2. 如果是從待安排區拖拽到座位區 (分配)
            else if (sourceId && sourceId.startsWith('UNASSIGNED') && targetId.startsWith('R')) {
                const studentId = parseInt(sourceId.split('_')[1]);
                const studentToAssign = students.find(s => s.id === studentId);
                const targetSeat = seatingMatrix.find(s => s.id === targetId);
                
                if (studentToAssign && targetSeat.student === null) {
                    targetSeat.student = studentToAssign;
                    renderApp();
                }
            }
        }
        
        /** 5. 拖拽交換座位：處理拖拽開始 (從座位或待安排區) */
        function handleDragStart(e) {
            const deskElement = e.target.closest('.seat-desk') || e.target.closest('.student-tag-unassigned');
            
            if (deskElement) {
                // 如果是從座位拖拽，設置來源座位 ID
                if (deskElement.classList.contains('seat-desk')) {
                    dragSourceDeskId = deskElement.dataset.deskId;
                } 
                // 如果是從待安排區拖拽，設置 UNASSIGNED_<ID>
                else if (deskElement.classList.contains('student-tag-unassigned')) {
                    dragSourceDeskId = `UNASSIGNED_${deskElement.dataset.studentId}`;
                }

                // 設置拖拽資料（可選，但對於跨元素拖拽是好習慣）
                e.dataTransfer.setData('text/plain', dragSourceDeskId);
                e.dataTransfer.effectAllowed = 'move';
            } else {
                 e.preventDefault(); // 阻止無效拖拽
            }
        }

        /** 處理拖拽經過 */
        function handleDragOver(e) {
            e.preventDefault(); // 允許放下
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        /** 處理拖拽離開 */
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        // --- 4. 智慧分配函數 ---

        /** 執行一鍵隨機分配 */
        function randomAssignStudents() {
            // 1. 找出所有未被安排的學生
            const assignedIds = seatingMatrix.filter(s => s.student !== null).map(s => s.student.id);
            const unassignedStudents = students.filter(s => !assignedIds.includes(s.id));

            // 2. 隨機排序待分配學生
            const shuffledStudents = unassignedStudents.sort(() => 0.5 - Math.random());

            // 3. 找出所有空座位
            const emptySeats = seatingMatrix.filter(s => s.student === null);

            // 4. 開始分配
            let studentIndex = 0;
            emptySeats.forEach(seat => {
                if (studentIndex < shuffledStudents.length) {
                    seat.student = shuffledStudents[studentIndex];
                    studentIndex++;
                }
            });

            renderApp();
        }

        // --- 點擊手動分配函數 ---
        
        /** 點擊待安排學生標籤 */
        function selectStudentForAssignment(studentId) {
            if (selectedStudent && selectedStudent.id === studentId) {
                // 取消選擇
                selectedStudent = null;
                $messageBox.classList.add('hidden');
            } else {
                selectedStudent = students.find(s => s.id === studentId);
                $messageBox.textContent = `已選擇學生: ${selectedStudent.name}。請點擊一個空座位進行安排。`;
                $messageBox.classList.remove('hidden');
            }
            renderApp(); // 重新渲染待安排列表以更新選擇狀態
        }

        /** 點擊座位進行手動安排 */
        function assignStudentToSeat(deskId) {
            const seat = seatingMatrix.find(s => s.id === deskId);
            
            // 檢查是否已選擇學生且座位為空
            if (selectedStudent && seat.student === null) {
                seat.student = selectedStudent;
                selectedStudent = null; // 分配完成後取消選擇
                $messageBox.classList.add('hidden');
                renderApp();
            } 
            // 如果點擊的座位上有學生，則選擇該學生 (用於拖拽/交換前的點擊邏輯，但這裡主要用拖拽)
            else if (seat.student !== null) {
                 // 這裡我們不處理點擊已佔用座位的邏輯，只依賴拖拽來交換
            } else if (selectedStudent === null && seat.student === null) {
                $messageBox.textContent = '請先點擊一位待安排學生。';
                $messageBox.classList.remove('hidden');
            }
        }


        // --- 渲染函數 ---

        /** 渲染待安排學生列表 */
        function renderUnassignedStudents() {
            const assignedIds = seatingMatrix.filter(s => s.student !== null).map(s => s.student.id);
            const unassignedStudents = students.filter(s => !assignedIds.includes(s.id));
            
            $unassignedList.innerHTML = '';
            
            if (unassignedStudents.length === 0) {
                $unassignedList.innerHTML = '<span class="text-green-300 font-medium">所有學生均已安排完畢！</span>';
                return;
            }

            unassignedStudents.forEach(student => {
                const isSelected = selectedStudent && selectedStudent.id === student.id;
                const studentTag = document.createElement('div');
                studentTag.className = `student-tag-unassigned student-tag p-2 rounded-lg font-semibold text-xs transition duration-150 ${
                    isSelected ? 'bg-yellow-400 text-black shadow-lg ring-4 ring-yellow-200' : 'bg-white/20 hover:bg-white/30 text-white/90'
                }`;
                studentTag.textContent = student.name;
                studentTag.dataset.studentId = student.id;
                studentTag.setAttribute('draggable', true);
                studentTag.onclick = () => selectStudentForAssignment(student.id);
                studentTag.addEventListener('dragstart', handleDragStart);

                $unassignedList.appendChild(studentTag);
            });
        }

        /** 6. 渲染座位表網格 */
        function renderSeatingChart() {
            // 根據模式設定網格列數和座位寬度
            const totalGridCols = config.isDoubleDesk ? config.cols * 2 : config.cols;
            $seatingChart.style.gridTemplateColumns = `repeat(${totalGridCols}, minmax(0, 1fr))`;
            $seatingChart.innerHTML = '';

            // 遍歷座位矩陣來渲染每個座位
            seatingMatrix.forEach(seat => {
                const desk = document.createElement('div');
                desk.dataset.deskId = seat.id;
                
                const student = seat.student;
                const isOccupied = student !== null;
                const isDouble = config.isDoubleDesk;
                
                // 設定基本的樣式
                desk.className = `seat-desk flex items-center justify-center p-2 rounded-xl h-20 transition-all duration-300 transform hover:scale-[1.01] cursor-pointer text-sm font-medium border border-white/20 shadow-lg`;
                
                // 應用雙人座樣式
                if (isDouble) {
                    // 雙人座佔用兩格
                    desk.classList.add('col-span-2');
                    desk.style.backgroundColor = isOccupied ? 'rgba(52, 211, 153, 0.3)' : 'rgba(255, 255, 255, 0.1)'; // 淺綠色佔用
                } else {
                    // 單人座佔用一格
                    desk.classList.add('col-span-1');
                    desk.style.backgroundColor = isOccupied ? 'rgba(59, 130, 246, 0.3)' : 'rgba(255, 255, 255, 0.1)'; // 淺藍色佔用
                }

                // 繪製學生標籤
                if (isOccupied) {
                    const studentTag = document.createElement('div');
                    studentTag.className = `student-tag bg-white text-gray-900 font-bold px-3 py-1 rounded-full shadow-md text-center w-full transition duration-150`;
                    studentTag.textContent = student.name;
                    studentTag.setAttribute('draggable', true);
                    studentTag.dataset.studentId = student.id;
                    
                    // 拖拽事件監聽器
                    studentTag.addEventListener('dragstart', handleDragStart);
                    desk.appendChild(studentTag);
                } else {
                    // 空位視覺標示
                    desk.textContent = '空位';
                    desk.classList.add('text-white/50', 'border-dashed');
                }
                
                // 點擊事件：用於手動分配
                desk.onclick = () => assignStudentToSeat(seat.id);

                // 拖拽事件監聽器 (座位本身是 Drop Target)
                desk.addEventListener('dragover', handleDragOver);
                desk.addEventListener('dragleave', handleDragLeave);
                desk.addEventListener('drop', handleDrop);
                
                $seatingChart.appendChild(desk);
            });
        }

        /** 統計資訊更新 */
        function updateStats() {
            const totalStudents = students.length;
            const assignedCount = seatingMatrix.filter(s => s.student !== null).length;
            const unassignedCount = totalStudents - assignedCount;

            document.getElementById('stat-total').textContent = totalStudents;
            document.getElementById('stat-assigned').textContent = assignedCount;
            document.getElementById('stat-unassigned').textContent = unassignedCount;
        }

        /** 總體渲染函數 */
        function renderApp() {
            renderSeatingChart();
            renderUnassignedStudents();
            updateStats();
        }

        // --- 應用程式啟動 ---
        window.onload = initializeApp;

    </script>
</body>
</html>
