<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧座位生成器 - AI Seating Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body {
            box-sizing: border-box;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
        }
        
        .seat {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        
        .seat::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        
        .seat:hover::before {
            left: 100%;
        }
        
        .seat:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .seat.occupied {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            color: #374151;
            box-shadow: 0 4px 15px rgba(199, 210, 254, 0.3);
            border-color: #000000;
        }
        
        .seat.empty {
            background: rgba(255, 255, 255, 0.8);
            border: 2px dashed #c7d2fe;
            color: #6366f1;
        }
        
        .seat.selected {
            background: #10b981;
            color: white;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.8); }
        }
        
        .student-item {
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .student-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.3s;
        }
        
        .student-item:hover::before {
            left: 100%;
        }
        
        .student-item:hover {
            transform: translateX(8px) scale(1.02);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .student-item.selected {
            background: #10b981;
            color: white;
            transform: translateX(8px) scale(1.02);
        }
        
        .dragging {
            opacity: 0.9;
            transform: scale(1.3);
            z-index: 1000;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: dragScale 0.6s ease-in-out infinite alternate;
        }
        
        @keyframes dragScale {
            from { 
                transform: scale(1.3);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            }
            to { 
                transform: scale(1.4);
                box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            }
        }
        
        .drop-zone-available {
            background: rgba(16, 185, 129, 0.05);
            border: 2px dashed #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            animation: availableZonePulse 2s ease-in-out infinite;
        }
        
        .drop-zone-active {
            background: rgba(16, 185, 129, 0.15);
            border: 3px solid #10b981;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            transform: scale(1.05);
            animation: activeZoneGlow 0.6s ease-in-out infinite alternate;
        }
        
        @keyframes availableZonePulse {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
                border-color: #10b981;
            }
            50% { 
                box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
                border-color: #059669;
            }
        }
        
        @keyframes activeZoneGlow {
            0% { 
                box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
                background: rgba(16, 185, 129, 0.15);
            }
            100% { 
                box-shadow: 0 0 35px rgba(16, 185, 129, 0.6);
                background: rgba(16, 185, 129, 0.25);
            }
        }
        
        @keyframes dragFloat {
            0% { 
                transform: rotate(-3deg) scale(1.1);
                box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            }
            100% { 
                transform: rotate(-5deg) scale(1.15);
                box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            }
        }
        
        .drag-preview {
            position: fixed;
            pointer-events: none;
            z-index: 1001;
            opacity: 0.9;
            transform: rotate(5deg) scale(1.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-radius: 12px;
            transition: none;
        }
        
        .smart-button {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .smart-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .smart-button:hover::before {
            left: 100%;
        }
        
        .smart-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .stats-card {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .ai-glow {
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(102, 126, 234, 0.3); }
            to { box-shadow: 0 0 40px rgba(102, 126, 234, 0.6); }
        }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .gradient-bg { background: white !important; }
        }
        
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

    <script>
        // 全域變數
        let students = [];
        let selectedStudent = null;
        let seatingData = {};
        let rows = 5;
        let cols = 6;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            students = [];
            updateStudentList();
            updateSeatingChart();
            updateStatistics();

            // 班級名稱即時更新
            document.getElementById('classNameInput').addEventListener('input', function() {
                const className = this.value;
                const titleElement = document.getElementById('classTitle');
                if (className.trim()) {
                    titleElement.textContent = className + ' - 座位表';
                    titleElement.style.display = 'block';
                } else {
                    titleElement.style.display = 'none';
                }
            });

            // 座位表設定監聽
            document.getElementById('rowsInput').addEventListener('change', function() {
                rows = parseInt(this.value);
            });

            document.getElementById('colsInput').addEventListener('change', function() {
                cols = parseInt(this.value);
            });
        });

        // 更新學生列表
        function updateStudentList() {
            const studentList = document.getElementById('studentList');
            studentList.innerHTML = '';

            if (students.length === 0) {
                studentList.innerHTML = '<div class="text-gray-500 text-center py-4">尚未匯入學生名單</div>';
                return;
            }

            students.forEach((student, index) => {
                const isAssigned = Object.values(seatingData).includes(student);
                const studentDiv = document.createElement('div');
                studentDiv.className = `student-item p-3 rounded-lg border ${isAssigned ? 'bg-gray-100 text-gray-500 border-gray-200' : 'bg-white border-gray-300 text-gray-800 cursor-pointer'}`;
                studentDiv.textContent = student;
                
                if (!isAssigned) {
                    studentDiv.addEventListener('click', () => selectStudent(student));
                }
                
                studentList.appendChild(studentDiv);
            });
        }

        // 選擇學生
        function selectStudent(student) {
            document.querySelectorAll('.student-item').forEach(item => {
                item.classList.remove('selected');
            });

            selectedStudent = student;
            event.target.classList.add('selected');
        }

        // 更新座位表
        function updateSeatingChart() {
            const seatingChart = document.getElementById('seatingChart');
            seatingChart.innerHTML = '';
            
            const seatType = document.querySelector('input[name="seatType"]:checked').value;
            
            // 保留相容的座位安排
            const newValidSeats = {};
            if (seatType === 'separate') {
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const seatId = `${row}-${col}`;
                        if (seatingData[seatId]) {
                            newValidSeats[seatId] = seatingData[seatId];
                        }
                    }
                }
            } else if (seatType === 'double') {
                for (let row = 0; row < rows; row++) {
                    for (let tableCol = 0; tableCol < Math.ceil(cols/2); tableCol++) {
                        const leftSeatId = `${row}-${tableCol * 2}`;
                        if (seatingData[leftSeatId]) {
                            newValidSeats[leftSeatId] = seatingData[leftSeatId];
                        }
                        if (tableCol * 2 + 1 < cols) {
                            const rightSeatId = `${row}-${tableCol * 2 + 1}`;
                            if (seatingData[rightSeatId]) {
                                newValidSeats[rightSeatId] = seatingData[rightSeatId];
                            }
                        }
                    }
                }
            }
            
            seatingData = newValidSeats;
            
            if (seatType === 'separate') {
                // 單人座模式
                const grid = document.createElement('div');
                grid.className = 'grid gap-3 justify-items-center';
                grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const seatId = `${row}-${col}`;
                        const seat = document.createElement('div');
                        seat.className = 'seat w-24 h-16 lg:w-28 lg:h-20 rounded-xl flex items-center justify-center text-base lg:text-lg font-bold border-2 shadow-lg';
                        seat.id = `seat-${seatId}`;
                        
                        const student = seatingData[seatId];
                        if (student) {
                            seat.classList.add('occupied');
                            seat.textContent = student;
                            seat.draggable = true;
                            
                            // Chrome相容性 - 移除舊事件監聽器
                            seat.removeEventListener('dragstart', handleDragStart);
                            seat.removeEventListener('dragend', handleDragEnd);
                            seat.removeEventListener('click', removeSeat);
                            
                            // 重新綁定事件
                            seat.addEventListener('dragstart', handleDragStart, { passive: false });
                            seat.addEventListener('dragend', handleDragEnd, { passive: false });
                            seat.addEventListener('click', () => removeSeat(seatId));
                        } else {
                            seat.classList.add('empty');
                            seat.textContent = '';
                            seat.draggable = false;
                            
                            // 移除舊事件監聽器
                            seat.removeEventListener('click', assignSeat);
                            seat.addEventListener('click', () => assignSeat(seatId));
                        }

                        // 移除舊的拖拽事件監聽器
                        seat.removeEventListener('dragover', handleDragOver);
                        seat.removeEventListener('dragenter', handleDragEnter);
                        seat.removeEventListener('dragleave', handleDragLeave);
                        seat.removeEventListener('drop', handleDrop);
                        
                        // 重新綁定拖拽事件
                        seat.addEventListener('dragover', handleDragOver, { passive: false });
                        seat.addEventListener('dragenter', handleDragEnter, { passive: false });
                        seat.addEventListener('dragleave', handleDragLeave, { passive: false });
                        seat.addEventListener('drop', handleDrop, { passive: false });
                        
                        // 為座位添加額外的拖拽區域標記
                        seat.setAttribute('data-drop-zone', 'true');
                        
                        grid.appendChild(seat);
                    }
                }
                seatingChart.appendChild(grid);
                
            } else if (seatType === 'double') {
                // 雙人座模式
                const grid = document.createElement('div');
                grid.className = 'grid gap-3 justify-items-center';
                grid.style.gridTemplateColumns = `repeat(${Math.ceil(cols/2)}, minmax(0, 1fr))`;

                for (let row = 0; row < rows; row++) {
                    for (let tableCol = 0; tableCol < Math.ceil(cols/2); tableCol++) {
                        const tableContainer = document.createElement('div');
                        tableContainer.className = 'flex gap-1 bg-white/10 backdrop-blur-sm p-2 rounded-xl border border-white/30 shadow-lg';
                        
                        // 左座位
                        const leftSeatId = `${row}-${tableCol * 2}`;
                        const leftSeat = document.createElement('div');
                        leftSeat.className = 'seat w-20 h-14 lg:w-24 lg:h-16 rounded-lg flex items-center justify-center text-sm lg:text-base font-bold border-2';
                        leftSeat.id = `seat-${leftSeatId}`;
                        
                        const leftStudent = seatingData[leftSeatId];
                        if (leftStudent) {
                            leftSeat.classList.add('occupied');
                            leftSeat.textContent = leftStudent;
                            leftSeat.draggable = true;
                            
                            // Chrome相容性 - 移除舊事件監聽器
                            leftSeat.removeEventListener('dragstart', handleDragStart);
                            leftSeat.removeEventListener('dragend', handleDragEnd);
                            leftSeat.removeEventListener('click', removeSeat);
                            
                            // 重新綁定事件
                            leftSeat.addEventListener('dragstart', handleDragStart, { passive: false });
                            leftSeat.addEventListener('dragend', handleDragEnd, { passive: false });
                            leftSeat.addEventListener('click', () => removeSeat(leftSeatId));
                        } else {
                            leftSeat.classList.add('empty');
                            leftSeat.textContent = '';
                            leftSeat.draggable = false;
                            
                            // 移除舊事件監聽器
                            leftSeat.removeEventListener('click', assignSeat);
                            leftSeat.addEventListener('click', () => assignSeat(leftSeatId));
                        }
                        
                        // 移除舊的拖拽事件監聽器
                        leftSeat.removeEventListener('dragover', handleDragOver);
                        leftSeat.removeEventListener('dragenter', handleDragEnter);
                        leftSeat.removeEventListener('dragleave', handleDragLeave);
                        leftSeat.removeEventListener('drop', handleDrop);
                        
                        // 重新綁定拖拽事件
                        leftSeat.addEventListener('dragover', handleDragOver, { passive: false });
                        leftSeat.addEventListener('dragenter', handleDragEnter, { passive: false });
                        leftSeat.addEventListener('dragleave', handleDragLeave, { passive: false });
                        leftSeat.addEventListener('drop', handleDrop, { passive: false });
                        
                        // 為座位添加額外的拖拽區域標記
                        leftSeat.setAttribute('data-drop-zone', 'true');
                        
                        tableContainer.appendChild(leftSeat);
                        
                        // 右座位
                        if (tableCol * 2 + 1 < cols) {
                            const rightSeatId = `${row}-${tableCol * 2 + 1}`;
                            const rightSeat = document.createElement('div');
                            rightSeat.className = 'seat w-20 h-14 lg:w-24 lg:h-16 rounded-lg flex items-center justify-center text-sm lg:text-base font-bold border-2';
                            rightSeat.id = `seat-${rightSeatId}`;
                            
                            const rightStudent = seatingData[rightSeatId];
                            if (rightStudent) {
                                rightSeat.classList.add('occupied');
                                rightSeat.textContent = rightStudent;
                                rightSeat.draggable = true;
                                
                                // Chrome相容性 - 移除舊事件監聽器
                                rightSeat.removeEventListener('dragstart', handleDragStart);
                                rightSeat.removeEventListener('dragend', handleDragEnd);
                                rightSeat.removeEventListener('click', removeSeat);
                                
                                // 重新綁定事件
                                rightSeat.addEventListener('dragstart', handleDragStart, { passive: false });
                                rightSeat.addEventListener('dragend', handleDragEnd, { passive: false });
                                rightSeat.addEventListener('click', () => removeSeat(rightSeatId));
                            } else {
                                rightSeat.classList.add('empty');
                                rightSeat.textContent = '';
                                rightSeat.draggable = false;
                                
                                // 移除舊事件監聽器
                                rightSeat.removeEventListener('click', assignSeat);
                                rightSeat.addEventListener('click', () => assignSeat(rightSeatId));
                            }
                            
                            // 移除舊的拖拽事件監聽器
                            rightSeat.removeEventListener('dragover', handleDragOver);
                            rightSeat.removeEventListener('dragenter', handleDragEnter);
                            rightSeat.removeEventListener('dragleave', handleDragLeave);
                            rightSeat.removeEventListener('drop', handleDrop);
                            
                            // 重新綁定拖拽事件
                            rightSeat.addEventListener('dragover', handleDragOver, { passive: false });
                            rightSeat.addEventListener('dragenter', handleDragEnter, { passive: false });
                            rightSeat.addEventListener('dragleave', handleDragLeave, { passive: false });
                            rightSeat.addEventListener('drop', handleDrop, { passive: false });
                            
                            // 為座位添加額外的拖拽區域標記
                            rightSeat.setAttribute('data-drop-zone', 'true');
                            
                            tableContainer.appendChild(rightSeat);
                        }
                        
                        grid.appendChild(tableContainer);
                    }
                }
                seatingChart.appendChild(grid);
            }
        }

        // 安排座位
        function assignSeat(seatId) {
            if (selectedStudent && !seatingData[seatId]) {
                seatingData[seatId] = selectedStudent;
                selectedStudent = null;
                
                document.querySelectorAll('.student-item').forEach(item => {
                    item.classList.remove('selected');
                });
                
                updateSeatingChart();
                updateStudentList();
                updateStatistics();
            }
        }

        // 移除座位
        function removeSeat(seatId) {
            if (seatingData[seatId]) {
                delete seatingData[seatId];
                updateSeatingChart();
                updateStudentList();
                updateStatistics();
            }
        }

        // 拖拽功能 - Chrome相容性優化
        let dragState = {
            element: null,
            seatId: null,
            student: null,
            startX: 0,
            startY: 0,
            isDragging: false
        };

        function handleDragStart(e) {
            const seatElement = e.target;
            const seatId = seatElement.id.replace('seat-', '');
            const student = seatingData[seatId];
            
            if (!student) {
                e.preventDefault();
                return false;
            }
            
            // 初始化拖拽狀態
            dragState = {
                element: seatElement,
                seatId: seatId,
                student: student,
                startX: e.clientX,
                startY: e.clientY,
                isDragging: true
            };
            
            // Chrome相容性設定
            try {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', student);
                e.dataTransfer.setData('application/json', JSON.stringify({
                    seatId: seatId,
                    student: student
                }));
            } catch (error) {
                console.warn('DataTransfer設定失敗:', error);
            }
            
            // 添加拖拽中的視覺效果
            setTimeout(() => {
                if (seatElement && dragState.isDragging) {
                    seatElement.classList.add('dragging');
                    seatElement.style.opacity = '0.5';
                }
            }, 0);
            
            // 顯示所有可放置區域
            highlightDropZones();
            
            return true;
        }



        function highlightDropZones() {
            // 移除淡綠色提示效果
        }

        function clearDropZones() {
            document.querySelectorAll('.seat').forEach(seat => {
                seat.classList.remove('drop-zone-available', 'drop-zone-active');
            });
        }

        // 尋找座位元素的輔助函數 - 擴大有效範圍
        function findSeatElement(element) {
            // 如果元素本身就是座位，直接返回
            if (element && element.classList && element.classList.contains('seat')) {
                return element;
            }
            
            // 檢查是否有拖拽區域標記
            if (element && element.hasAttribute && element.hasAttribute('data-drop-zone')) {
                return element;
            }
            
            // 向上搜尋父元素，最多搜尋5層，擴大搜尋範圍
            let current = element;
            let depth = 0;
            while (current && current.parentElement && depth < 5) {
                current = current.parentElement;
                if (current.classList && current.classList.contains('seat')) {
                    return current;
                }
                if (current.hasAttribute && current.hasAttribute('data-drop-zone')) {
                    return current;
                }
                depth++;
            }
            
            // 如果沒找到，嘗試在附近更大區域尋找座位元素
            if (element && element.getBoundingClientRect) {
                const rect = element.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                // 擴大搜尋範圍，在多個點位尋找
                const searchPoints = [
                    [centerX, centerY],
                    [centerX - 20, centerY],
                    [centerX + 20, centerY],
                    [centerX, centerY - 20],
                    [centerX, centerY + 20]
                ];
                
                for (const [x, y] of searchPoints) {
                    const nearbyElement = document.elementFromPoint(x, y);
                    if (nearbyElement && nearbyElement.classList && nearbyElement.classList.contains('seat')) {
                        return nearbyElement;
                    }
                }
            }
            
            return null;
        }

        function handleDragOver(e) {
            if (!dragState.isDragging) return;
            
            e.preventDefault();
            e.stopPropagation();
            
            // Chrome相容性設定
            if (e.dataTransfer) {
                e.dataTransfer.dropEffect = 'move';
            }
            
            // 擴大有效範圍 - 檢查目標元素或其父元素是否為座位
            const targetSeat = findSeatElement(e.target);
            if (targetSeat && targetSeat !== dragState.element) {
                // 清除其他座位的高亮
                document.querySelectorAll('.drop-zone-active').forEach(seat => {
                    if (seat !== targetSeat) {
                        seat.classList.remove('drop-zone-active');
                    }
                });
                targetSeat.classList.add('drop-zone-active');
            }
        }

        function handleDragEnter(e) {
            if (!dragState.isDragging) return;
            
            e.preventDefault();
            e.stopPropagation();
            
            const targetSeat = findSeatElement(e.target);
            if (targetSeat && targetSeat !== dragState.element) {
                targetSeat.classList.add('drop-zone-active');
            }
        }

        function handleDragLeave(e) {
            if (!dragState.isDragging) return;
            
            const targetSeat = findSeatElement(e.target);
            if (targetSeat && !targetSeat.contains(e.relatedTarget)) {
                targetSeat.classList.remove('drop-zone-active');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            
            if (!dragState.isDragging) {
                cleanupDragState();
                return;
            }
            
            // 擴大有效範圍 - 尋找最近的座位元素
            const targetSeat = findSeatElement(e.target);
            if (!targetSeat || targetSeat === dragState.element) {
                cleanupDragState();
                return;
            }
            
            const targetSeatId = targetSeat.id.replace('seat-', '');
            const targetStudent = seatingData[targetSeatId];
            
            // 驗證拖拽數據
            let dragData = null;
            try {
                const jsonData = e.dataTransfer.getData('application/json');
                if (jsonData) {
                    dragData = JSON.parse(jsonData);
                }
            } catch (error) {
                // 使用備用數據
                dragData = {
                    seatId: dragState.seatId,
                    student: dragState.student
                };
            }
            
            if (!dragData || !dragData.student) {
                cleanupDragState();
                return;
            }
            
            // 執行位置交換或移動
            if (targetStudent) {
                // 交換兩個學生的位置
                seatingData[dragState.seatId] = targetStudent;
                seatingData[targetSeatId] = dragState.student;
            } else {
                // 移動到空座位
                delete seatingData[dragState.seatId];
                seatingData[targetSeatId] = dragState.student;
            }
            
            // 更新界面
            updateSeatingChart();
            updateStudentList();
            updateStatistics();
            
            cleanupDragState();
        }

        function handleDragEnd(e) {
            // 延遲清理，確保drop事件能正常執行
            setTimeout(() => {
                cleanupDragState();
            }, 100);
        }

        function cleanupDragState() {
            // 清理拖拽元素樣式
            if (dragState.element) {
                dragState.element.classList.remove('dragging');
                dragState.element.style.opacity = '';
            }
            
            // 清理所有放置區域樣式
            clearDropZones();
            
            // 重置拖拽狀態
            dragState = {
                element: null,
                seatId: null,
                student: null,
                startX: 0,
                startY: 0,
                isDragging: false
            };
        }

        // 匯入學生
        function importStudents() {
            const input = document.getElementById('studentListInput').value.trim();
            if (input) {
                const newStudents = input.split('\n').filter(name => name.trim()).map(name => name.trim());
                
                if (newStudents.length > 0) {
                    students = [];
                    seatingData = {};
                    students = [...new Set(newStudents)];
                    
                    updateSeatingChart();
                    updateStudentList();
                    updateStatistics();
                    document.getElementById('studentListInput').value = '';
                    
                    // 顯示成功訊息
                    showNotification(`✅ 成功匯入 ${students.length} 名學生！`, 'success');
                } else {
                    showNotification('❌ 請輸入有效的學生名單！', 'error');
                }
            } else {
                showNotification('❌ 請先輸入學生名單！', 'error');
            }
        }

        // 智慧隨機分配
        function smartRandomAssign() {
            if (students.length === 0) {
                showNotification('❌ 請先匯入學生名單！', 'error');
                return;
            }
            
            seatingData = {};
            const availableSeats = [];
            const studentsToAssign = [...students];
            const seatType = document.querySelector('input[name="seatType"]:checked').value;
            
            // 生成可用座位
            if (seatType === 'separate') {
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        availableSeats.push(`${row}-${col}`);
                    }
                }
            } else if (seatType === 'double') {
                for (let row = 0; row < rows; row++) {
                    for (let tableCol = 0; tableCol < Math.ceil(cols/2); tableCol++) {
                        availableSeats.push(`${row}-${tableCol * 2}`);
                        if (tableCol * 2 + 1 < cols) {
                            availableSeats.push(`${row}-${tableCol * 2 + 1}`);
                        }
                    }
                }
            }
            
            if (availableSeats.length < studentsToAssign.length) {
                const seatTypeName = seatType === 'separate' ? '單人座' : '雙人座';
                showNotification(`❌ 座位不足！${seatTypeName}模式有 ${availableSeats.length} 個座位，需要 ${studentsToAssign.length} 名學生`, 'error');
                return;
            }
            
            // 智慧分配演算法
            while (studentsToAssign.length > 0) {
                const randomSeatIndex = Math.floor(Math.random() * availableSeats.length);
                const randomStudentIndex = Math.floor(Math.random() * studentsToAssign.length);
                
                seatingData[availableSeats[randomSeatIndex]] = studentsToAssign[randomStudentIndex];
                
                availableSeats.splice(randomSeatIndex, 1);
                studentsToAssign.splice(randomStudentIndex, 1);
            }
            
            updateSeatingChart();
            updateStudentList();
            updateStatistics();
            
            const seatTypeName = seatType === 'separate' ? '單人座' : '雙人座';
            showNotification(`🎉 成功分配 ${students.length} 名學生！使用${seatTypeName}模式`, 'success');
        }



        // 清空座位
        function clearAllSeats() {
            seatingData = {};
            selectedStudent = null;
            
            document.querySelectorAll('.student-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            updateSeatingChart();
            updateStudentList();
            updateStatistics();
            
            showNotification('🧹 座位已清空重置', 'info');
        }

        // 更新統計
        function updateStatistics() {
            const total = students.length;
            const assigned = Object.keys(seatingData).length;
            const unassigned = total - assigned;
            
            document.getElementById('totalStudents').textContent = total;
            document.getElementById('assignedStudents').textContent = assigned;
            document.getElementById('unassignedStudents').textContent = unassigned;
        }

        // 通知系統
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            
            notification.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50 transform translate-x-full transition-transform duration-300`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            setTimeout(() => {
                notification.style.transform = 'translateX(full)';
                setTimeout(() => {
                    if (document.body.contains(notification)) {
                        document.body.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }

        // JPG下載功能
        function downloadJPG() {
            if (students.length === 0) {
                showNotification('❌ 請先匯入學生名單！', 'error');
                return;
            }
            
            // 顯示載入動畫
            const btnText = document.getElementById('downloadBtnText');

                spinner.classList.add('hidden');
